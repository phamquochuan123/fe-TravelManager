server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security header đặt ở ĐÂY chứ không phải Caddyfile: khi chạy qua Cloudflare Quick Tunnel,
    # cloudflared trỏ thẳng vào container này (frontend:8080) nên Caddy bị bypass hoàn toàn —
    # header khai trong Caddyfile sẽ không bao giờ có tác dụng.
    # "always" để header vẫn được gửi kèm cả response lỗi (4xx/5xx).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Không đặt HSTS ở đây: TLS do Cloudflare terminate ở edge, bật HSTS tại tầng này
    # dễ tự khoá chính mình khi cần test qua HTTP ở local.

    # React Router: fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/v1 về Spring Boot container
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
